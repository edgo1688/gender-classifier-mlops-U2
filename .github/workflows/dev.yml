name: CI/CD Pipeline - Development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: genderclassifiermodel-dev
  REGISTRY_NAME: acrmlopsicesiu2.azurecr.io
  IMAGE_NAME: gender-classifier
  MODEL_URL: https://samlopsicesiu2.blob.core.windows.net/models/gender_googlenet.onnx

jobs:
  test:
    name: Test Model
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download test data from Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python -c "
          import os
          from azure.storage.blob import BlobServiceClient
          
          connection_string = os.getenv('AZURE_STORAGE_CONNECTION_STRING')
          if connection_string:
              try:
                  blob_service_client = BlobServiceClient.from_connection_string(connection_string)
                  blob_client = blob_service_client.get_blob_client(
                      container='testdata',
                      blob='test_samples.csv'
                  )
                  
                  os.makedirs('test_data', exist_ok=True)
                  with open('test_data/test_samples.csv', 'wb') as f:
                      f.write(blob_client.download_blob().readall())
                  print('Test data downloaded successfully')
              except Exception as e:
                  print(f'Warning: Could not download test data: {e}')
                  print('Tests will use default data')
          else:
              print('No Azure connection string, using default test data')
          "
      
      - name: Download ONNX model
        run: |
          mkdir -p model
          curl -L -o model/gender_googlenet.onnx ${{ env.MODEL_URL }}
          echo "Model downloaded successfully"
          ls -lh model/
      
      - name: Run unit tests
        env:
          MODEL_PATH: ./model/gender_googlenet.onnx
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          pytest tests/test_model.py -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-dev
          path: |
            test_data/
            model/
          retention-days: 5

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_NAME }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}
      
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-latest \
            -t ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-${{ env.IMAGE_TAG }} \
            .
          
          docker push ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-latest
          docker push ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-${{ env.IMAGE_TAG }}
          
          echo "Image pushed successfully:"
          echo "  - ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-latest"
          echo "  - ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-${{ env.IMAGE_TAG }}"
      
      - name: Deploy to Azure Web App
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            # Update Web App container settings
            az webapp config container set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group rgmlopsicesiu2 \
              --container-image-name ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-latest \
              --container-registry-url https://${{ env.REGISTRY_NAME }} \
              --container-registry-user ${{ secrets.AZURE_ACR_USERNAME }} \
              --container-registry-password ${{ secrets.AZURE_ACR_PASSWORD }}
            
            echo "Container image updated to: ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-latest"
            
            # Restart the Web App to pull the new image
            az webapp restart \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group rgmlopsicesiu2
            
            echo "Web App restarted successfully"
      
      - name: Set Web App environment variables
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group rgmlopsicesiu2 \
              --settings \
                ENVIRONMENT=dev \
                MODEL_URL=${{ env.MODEL_URL }} \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                PREDICTIONS_CONTAINER=predictions
      
      - name: Verify deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30
          
          # Try to reach the health endpoint
          HEALTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Checking health endpoint: $HEALTH_URL"
          
          for i in {1..10}; do
            if curl -f -s -o /dev/null -w "%{http_code}" $HEALTH_URL | grep -q "200"; then
              echo "✓ Deployment successful! App is healthy."
              exit 0
            fi
            echo "Attempt $i: App not ready yet, waiting..."
            sleep 10
          done
          
          echo "Warning: Could not verify deployment health"
      
      - name: Deployment summary
        run: |
          echo "## Deployment Summary - DEV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Web App**: ${{ env.AZURE_WEBAPP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "- **Health**: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
